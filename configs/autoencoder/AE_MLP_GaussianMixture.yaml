# Autoencoder on 2D Synthetic Data
# Pure reconstruction loss (no KL divergence) — illustrates unregularized latent space

type: "autoencoder"
gen_mode: "synthetic2d"

# Model configuration (MLP encoder/decoder)
model:
  type: "ae_mlp"
  input_dim: 2
  hidden_size: 256
  depth: 3
  latent_dim: 8
  num_classes: 0

# Data configuration
data:
  name: "synthetic2d"
  distribution: "gaussian_mixture"
  num_samples: 100000
  batch_size: 256
  num_workers: 0

# Training configuration
training:
  exp_name: "autoencoder_gaussian_mixture"
  log_dir: "./logs"
  seed: 42
  total_steps: 20000
  log_freq: 100
  save_freq: 5000
  vis_freq: 50
  grad_clip: 1.0

  optimizer:
    type: "adamw"
    lr: 1.0e-3
    beta1: 0.9
    beta2: 0.999
    weight_decay: 0.0

# Inference settings
inference:
  num_samples: 1000
