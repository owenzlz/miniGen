# Improved Consistency Training (iCT) on 2D Synthetic Data
# Single-step generation via self-consistency objective

type: "consistency_training"
gen_mode: "synthetic2d"

# Model configuration (reuses MLPDenoiser with EDM preconditioning in process)
model:
  type: "mlp"
  input_dim: 2
  hidden_size: 256
  depth: 6
  num_classes: 0
  class_dropout_prob: 0.0

# iCT-specific configuration
consistency_training:
  sigma_min: 0.002
  sigma_max: 1.0
  sigma_data: 0.5
  rho: 7.0
  initial_timesteps: 10     # s0: starting discretization steps
  final_timesteps: 150      # s1: final discretization steps
  p_mean: -1.5              # lognormal sampling mean
  p_std: 1.2                # lognormal sampling std

# Data configuration
data:
  name: "synthetic2d"
  distribution: "checkerboard"
  num_samples: 5000
  batch_size: 256
  num_workers: 0

# Training configuration
training:
  exp_name: "consistency_training_checkerboard"
  log_dir: "./logs"
  seed: 42
  total_steps: 40000
  log_freq: 100
  save_freq: 5000
  vis_freq: 50
  grad_clip: 1.0

  optimizer:
    type: "adamw"
    lr: 1.0e-3
    beta1: 0.9
    beta2: 0.999
    weight_decay: 0.0

# Inference settings
inference:
  num_samples: 1000
  num_steps: 1              # Single-step sampling (consistency model)
