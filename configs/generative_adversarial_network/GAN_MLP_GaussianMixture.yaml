# GAN on 2D Synthetic Data
# Adversarial training with generator and discriminator

type: "generative_adversarial_network"
gen_mode: "synthetic2d"

# Generator model configuration
model:
  type: "generator_mlp"
  input_dim: 2
  hidden_size: 256
  depth: 4
  latent_dim: 16
  num_classes: 0

# GAN-specific configuration
generative_adversarial_network:
  disc_hidden_size: 256  # Discriminator hidden dimension
  disc_depth: 4          # Discriminator hidden layers
  disc_lr: 2.0e-4        # Discriminator learning rate
  n_critic: 1            # Discriminator updates per generator update

# Data configuration
data:
  name: "synthetic2d"
  distribution: "gaussian_mixture"
  num_samples: 100000
  batch_size: 256
  num_workers: 0

# Training configuration
training:
  exp_name: "generative_adversarial_network_gaussian_mixture"
  log_dir: "./logs"
  seed: 42
  total_steps: 20000
  log_freq: 100
  save_freq: 5000
  vis_freq: 50
  grad_clip: 1.0

  optimizer:
    type: "adamw"
    lr: 2.0e-4
    beta1: 0.5
    beta2: 0.999
    weight_decay: 0.0

# Inference settings
inference:
  num_samples: 1000
