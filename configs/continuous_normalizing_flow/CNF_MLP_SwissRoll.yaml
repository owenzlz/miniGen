# Continuous Normalizing Flow (FFJORD) on 2D Synthetic Data
# Maximum likelihood via continuous change of variables

type: "continuous_normalizing_flow"
gen_mode: "synthetic2d"

# Model configuration (MLP velocity field, same as flow matching)
model:
  type: "mlp"
  input_dim: 2
  hidden_size: 256
  depth: 6
  num_classes: 0
  class_dropout_prob: 0.0

# CNF-specific configuration
continuous_normalizing_flow:
  num_integration_steps: 30  # Euler steps for ODE integration during training

# Data configuration
data:
  name: "synthetic2d"
  distribution: "swiss_roll"
  num_samples: 100000
  batch_size: 256
  num_workers: 0

# Training configuration
training:
  exp_name: "continuous_normalizing_flow_swiss_roll"
  log_dir: "./logs"
  seed: 42
  total_steps: 20000
  log_freq: 100
  save_freq: 5000
  vis_freq: 50
  grad_clip: 1.0

  optimizer:
    type: "adamw"
    lr: 3.0e-4
    beta1: 0.9
    beta2: 0.999
    weight_decay: 0.0

# Inference settings
inference:
  num_samples: 1000
  num_steps: 50          # Euler steps for ODE sampling
