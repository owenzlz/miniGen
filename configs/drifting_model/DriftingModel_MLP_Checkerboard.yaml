# Drifting Model on 2D Synthetic Data
# One-step generation via training-time distribution evolution

type: "drifting_model"
gen_mode: "synthetic2d"

# Generator model configuration
model:
  type: "drifting_mlp"
  input_dim: 2
  hidden_size: 256
  depth: 3
  latent_dim: 32
  num_classes: 0

# Drifting model-specific configuration
drifting_model:
  temp: 0.05  # Kernel temperature τ

# Data configuration
data:
  name: "synthetic2d"
  distribution: "checkerboard"
  num_samples: 100000
  batch_size: 2048
  num_workers: 0

# Training configuration
training:
  exp_name: "drifting_model_checkerboard"
  log_dir: "./logs"
  seed: 42
  total_steps: 5000
  log_freq: 100
  save_freq: 5000
  vis_freq: 100
  grad_clip: 1.0

  optimizer:
    type: "adamw"
    lr: 1.0e-3
    beta1: 0.9
    beta2: 0.999
    weight_decay: 0.0

# Inference settings
inference:
  num_samples: 1000
