type: "autoregressive"
gen_mode: "synthetic2d"

model:
  type: "ar_transformer"
  input_dim: 2
  num_bins: 128
  hidden_size: 256
  depth: 2
  num_heads: 4
  num_classes: 0
  class_dropout_prob: 0.0

autoregressive:
  num_bins: 128
  temperature: 1.0

data:
  name: "synthetic2d"
  distribution: "swiss_roll"
  num_samples: 100000
  batch_size: 256
  num_workers: 0

training:
  exp_name: "autoregressive_swiss_roll"
  log_dir: "./logs"
  seed: 42
  total_steps: 20000
  log_freq: 100
  save_freq: 5000
  vis_freq: 50
  grad_clip: 1.0

  optimizer:
    type: "adamw"
    lr: 1.0e-3
    beta1: 0.9
    beta2: 0.999
    weight_decay: 0.0

inference:
  num_samples: 1000
  num_steps: null
  sampler: null
  cfg_scale: 1.0
