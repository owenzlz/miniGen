# Score Matching (NCSN) on 2D Synthetic Data
# Denoising score matching with annealed Langevin dynamics

type: "score_matching_ncsn"
gen_mode: "synthetic2d"

# Model configuration (MLP denoiser, same as diffusion)
model:
  type: "mlp"
  input_dim: 2
  hidden_size: 256
  depth: 6
  num_classes: 0
  class_dropout_prob: 0.0

# NCSN configuration
score_matching_ncsn:
  num_noise_levels: 10   # Number of geometric noise levels (L)
  sigma_min: 0.01        # Smallest noise level
  sigma_max: 1.0         # Largest noise level
  langevin_steps: 100    # Langevin steps per noise level during sampling
  langevin_eps: 1.0e-5   # Base Langevin step size (must be << sigma_min^2)

# Data configuration
data:
  name: "synthetic2d"
  distribution: "checkerboard"
  num_samples: 100000
  batch_size: 256
  num_workers: 0

# Training configuration
training:
  exp_name: "score_matching_ncsn_checkerboard"
  log_dir: "./logs"
  seed: 42
  total_steps: 20000
  log_freq: 100
  save_freq: 5000
  vis_freq: 50
  grad_clip: 1.0

  optimizer:
    type: "adamw"
    lr: 1.0e-3
    beta1: 0.9
    beta2: 0.999
    weight_decay: 0.0

# Inference settings
inference:
  num_samples: 1000
  num_steps: 1000        # Total Langevin steps (split across noise levels)
