# VAE on 2D Synthetic Data
# Learns a latent space and reconstructs via ELBO

type: "variational_autoencoder"
gen_mode: "synthetic2d"

# Model configuration (MLP encoder/decoder)
model:
  type: "vae_mlp"
  input_dim: 2
  hidden_size: 256
  depth: 3
  latent_dim: 8
  num_classes: 0

# VAE-specific configuration
variational_autoencoder:
  beta: 0.1              # KL divergence weight (1.0 = standard ELBO, >1 = beta-VAE)

# Data configuration
data:
  name: "synthetic2d"
  distribution: "swiss_roll"
  num_samples: 100000
  batch_size: 256
  num_workers: 0

# Training configuration
training:
  exp_name: "variational_autoencoder_swiss_roll"
  log_dir: "./logs"
  seed: 42
  total_steps: 20000
  log_freq: 100
  save_freq: 5000
  vis_freq: 50
  grad_clip: 1.0

  optimizer:
    type: "adamw"
    lr: 1.0e-3
    beta1: 0.9
    beta2: 0.999
    weight_decay: 0.0

# Inference settings
inference:
  num_samples: 1000
