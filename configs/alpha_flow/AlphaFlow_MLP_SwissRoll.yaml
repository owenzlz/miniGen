# AlphaFlow on 2D Synthetic Data
# Unifies flow matching and MeanFlow via tunable alpha parameter
# alpha=0: pure continuous (MeanFlow), alpha=1: pure discrete
# Reference: Zhang et al., "AlphaFlow: Understanding and Improving MeanFlow Models"

type: "alpha_flow"
gen_mode: "synthetic2d"

# AlphaFlow configuration
alpha_flow:
  alpha: 0.0                     # Balance: 0=continuous (MeanFlow), 1=discrete
  discrete_dt: 0.01              # Step size for discrete target computation
  data_proportion: 0.75          # Fraction of batch with r=t (flow matching regime)
  logit_normal_mean: -0.4        # Mean of logit-normal time distribution
  logit_normal_std: 1.0          # Std of logit-normal time distribution

# Model configuration (reuses MeanFlow single-head MLP)
model:
  type: "meanflow_mlp"
  input_dim: 2
  hidden_size: 256
  depth: 6

# Data configuration
data:
  name: "synthetic2d"
  distribution: "swiss_roll"
  num_samples: 100000
  batch_size: 256
  num_workers: 0

# Training configuration
training:
  exp_name: "alpha_flow_swiss_roll"
  log_dir: "./logs"
  seed: 42
  total_steps: 20000
  log_freq: 100
  save_freq: 5000
  vis_freq: 50
  grad_clip: 1.0

  optimizer:
    type: "adamw"
    lr: 1.0e-3
    beta1: 0.9
    beta2: 0.999
    weight_decay: 0.0

# Inference settings
inference:
  num_samples: 1000
  num_steps: 1                   # One-step generation (use more for multi-step Euler)
