# Explicit Score Matching (Hyvarinen, 2005) on 2D Synthetic Data
# Learns the score via integration by parts — no noise added to data

type: "score_matching_hyvarinen"
gen_mode: "synthetic2d"

# Model configuration (MLP, same as diffusion/NCSN)
model:
  type: "mlp"
  input_dim: 2
  hidden_size: 256
  depth: 6
  num_classes: 0
  class_dropout_prob: 0.0

# Hyvarinen score matching configuration
score_matching_hyvarinen:
  langevin_steps: 1000   # Langevin steps for sampling
  langevin_eps: 1.0e-4   # Langevin step size

# Data configuration
data:
  name: "synthetic2d"
  distribution: "swiss_roll"
  num_samples: 100000
  batch_size: 256
  num_workers: 0

# Training configuration
training:
  exp_name: "score_matching_hyvarinen_swiss_roll"
  log_dir: "./logs"
  seed: 42
  total_steps: 20000
  log_freq: 100
  save_freq: 5000
  vis_freq: 50
  grad_clip: 1.0

  optimizer:
    type: "adamw"
    lr: 1.0e-3
    beta1: 0.9
    beta2: 0.999
    weight_decay: 0.0

# Inference settings
inference:
  num_samples: 1000
  num_steps: 1000        # Total Langevin steps
