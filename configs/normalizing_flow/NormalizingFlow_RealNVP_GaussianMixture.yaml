# Normalizing Flow (RealNVP) on 2D Synthetic Data
# Exact log-likelihood via change of variables

type: "normalizing_flow"
gen_mode: "synthetic2d"

# Model configuration (RealNVP with affine coupling layers)
model:
  type: "realnvp"
  input_dim: 2
  hidden_size: 128
  num_coupling_layers: 8
  coupling_depth: 2
  num_classes: 0

# Data configuration
data:
  name: "synthetic2d"
  distribution: "gaussian_mixture"
  num_samples: 100000
  batch_size: 256
  num_workers: 0

# Training configuration
training:
  exp_name: "normalizing_flow_gaussian_mixture"
  log_dir: "./logs"
  seed: 42
  total_steps: 20000
  log_freq: 100
  save_freq: 5000
  vis_freq: 50
  grad_clip: 1.0

  optimizer:
    type: "adamw"
    lr: 1.0e-3
    beta1: 0.9
    beta2: 0.999
    weight_decay: 0.0

# Inference settings
inference:
  num_samples: 1000
